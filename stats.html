<style>

<script>
const D = window.HOTKEY_DRILLS;
const fmtS = ms => (ms/1000).toFixed(2)+'s';
/* r272 — semantic shortcut units (mirror of index.html's chordifyLog; keep in sync):
   alt-ribbon runs as one chord, ctrl chords as logged, functions from typed formulas. */
function isChordUnit(k){
  return /^alt( [a-z0-9]){1,6}$/.test(k) || /\(\)$/.test(k) || /^F[0-9]+$/.test(k) || /^Ctrl\+/.test(k);
}
function chordifyLog(log){
  const out=[]; let i=0;
  while(i<log.length){
    const k=String(log[i]||'');
    if(k==='Alt'){ let j=i+1; const seq=[];
      while(j<log.length && seq.length<6 && /^[a-z0-9]$/i.test(String(log[j]||''))){ seq.push(String(log[j]).toLowerCase()); j++; }
      if(seq.length) out.push('alt '+seq.join(' '));
      i=j; continue; }
    if(k==='='){ let j=i+1, buf='=';
      while(j<log.length){ const c=String(log[j]||'');
        if(c==='\u21b5'||c==='Tab'||c==='Esc') break;
        if(c.length===1) buf+=c; j++; }
      (buf.toUpperCase().match(/[A-Z][A-Z0-9]*\(/g)||[]).forEach(fn=>out.push(fn.slice(0,-1)+'()'));
      i=j; continue; }
    if(/^Ctrl\+/.test(k) || /^F[0-9]+$/.test(k)) out.push(k);
    i++;
  }
  return out;
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function load(){
  const root=document.getElementById('root');
  let me=null;
  try{ const { data:{ session } } = await sb.auth.getSession(); me = session ? session.user : null; }catch(e){}

  // local PBs always available (anon-friendly)
  let localPB={};
  try{ localPB = JSON.parse(localStorage.getItem('hotkey_pb')||'{}'); }catch(e){}

  let mine=[], all=[];
  if(sb && me){
    try{
      const r = await sb.from('runs').select('user_id,challenge,time_ms,keystrokes,optimal,created_at').eq('mouse_used',false).order('time_ms',{ascending:true});
      all = r.data||[];
      mine = all.filter(x=>x.user_id===me.id);
    }catch(e){}
  }
  // r273: the ACCOUNT-side analytics aggregate — primary source when signed in;
  // localStorage stays the guest/offline cache
  let srvKeys=null;
  if(sb && me){ try{ const {data}=await sb.from('key_stats').select('counts,keys_lifetime').eq('user_id',me.id).maybeSingle();
    if(data && data.counts && Object.keys(data.counts).length) srvKeys=data; }catch(e){} }

  // headline numbers — posted runs if signed in, else local PBs
  const drilled = new Set(mine.map(x=>x.challenge).filter(k=>D.meta[k]));
  Object.keys(localPB).forEach(k=>{ if(D.meta[k]) drilled.add(k); });
  const totalRuns = mine.length;
  let bestKps=0, effSum=0, effN=0;
  mine.forEach(x=>{
    if(x.time_ms>0 && x.keystrokes>0) bestKps=Math.max(bestKps, x.keystrokes/(x.time_ms/1000));
    if(x.keystrokes>0 && x.optimal>0){ effSum += Math.min(1, x.optimal/x.keystrokes); effN++; }
  });
  const avgEff = effN ? Math.round(100*effSum/effN) : null;

  let streakN=0; try{ const s=JSON.parse(localStorage.getItem('hotkey_streak')||'{}'); streakN=s.n||0; }catch(e){}

  // r135: featured-achievement picks — server copy wins when signed in
  // r423: the profile row also feeds the canonical hero card (handle, flair/loadout, chips)
  let feat=[]; try{ feat=JSON.parse(localStorage.getItem('hk_feat_ach')||'[]'); }catch(e){}
  let myProf=null;
  if(sb && me){ try{
    const {data:pr}=await sb.from('profiles').select('handle,flair,featured_ach,school_tag,show_school,team_code').eq('id',me.id).maybeSingle();
    myProf=pr||null;
    if(pr && pr.featured_ach!=null){ feat=String(pr.featured_ach).split(',').filter(Boolean);
      localStorage.setItem('hk_feat_ach', JSON.stringify(feat)); }
  }catch(e){} }

  // title-card strip: the canonical player card, from shared HK_RANK helpers
  let tcHtml='';
  if(me && window.HK_RANK){
    const st = window.HK_RANK.standing(all, me.id, D.menuOrder);
    const tier = window.HK_RANK.tierOf(st.avgPct, st.att, st.wsum);
    // r302 (Wolf): write-through — the freshest computed tier updates the shared nav-pill
    // cache, so the top bar can never disagree with the page you're looking at
    // r423 (Wolf): cache + pill carry the BUCKET too (rank AND bucket, nav.js pillHtml grammar)
    try{ sessionStorage.setItem('hk_rank3', JSON.stringify({n:tier.name,c:tier.cls,b:tier.bucket,exp:Date.now()+6e5}));
      const rp=document.getElementById('navRankPill');
      /* r426: delegate to nav.js hkRankPillHtml — one pill grammar, spelled-out buckets
         ("top bucket" / "middle bucket" / "bottom bucket"; never "mid"). */
      if(rp && window.hkRankPillHtml){ rp.innerHTML=window.hkRankPillHtml(tier.name, tier.bucket);
        rp.className='pc-tier '+tier.cls+' topnav-rank'; rp.style.display='inline-flex'; } }catch(e){}
    let mySes=[]; try{ const se=await sb.from('sessions').select('user_id,mode').eq('user_id', me.id); mySes=se.data||[]; }catch(e){}
    const plBoards = window.HK_RANK.boardCounts ? window.HK_RANK.boardCounts(all, me.id, D.menuOrder) : st;
    const xp = window.HK_RANK.computeXP(mine, plBoards, mySes);   /* r371: full signature — board bonuses + sessions, same as nav/lb */
    const L = window.HK_RANK.levelOf(xp);
    /* r423 (Wolf, ONE-CARD LAW): the stats hero renders the SAME 462px hkPlayerCard
       object as the header rank-click card — full scale, skin on the .uc, 5-slot medal
       showcase, rank-click stat grammar. The page-specific yc-* panel is retired. */
    const lo = window.hkFlair ? window.hkFlair(myProf && myProf.flair) : {frame:null, show:{}, stats:[]};
    const fv = (lo.frame && window.HK_FRAMES && window.HK_FRAMES.some(f=>f.id===lo.frame)) ? lo.frame : null;
    const medals=(function(){ try{
      const AC=window.HOTKEY_ACHIEVEMENTS; if(!AC || !feat.length) return [];
      const byId={}; AC.forEach(a=>byId[a.id]=a);
      /* r426 (Wolf \u00a74b): instant hover tip on every medal chip \u2014 name \u00b7 desc \u00b7 state. */
      return feat.map(id=>byId[id]).filter(Boolean).slice(0,5).map(a=>({glyph:a.glyph,name:a.name,size:30,
        tip:a.name+' \u2014 '+a.desc+' \u2713 EARNED',
        rarity:window.hkEffRarity?window.hkEffRarity(a.tier):undefined})); }catch(e){ return []; } })();
    let tagBits='';
    try{ if(myProf && myProf.show_school && myProf.school_tag){
        const nm=((window.schoolResolve&&window.schoolResolve(myProf.school_tag))||{}).name||myProf.school_tag;
        tagBits+='<span class="uc-tag">'+(window.schoolChip?window.schoolChip(myProf.school_tag,20):'')+'<span>'+esc(nm)+'</span></span>'; }
      if(lo.show && lo.show.desk && myProf && myProf.team_code) tagBits+='<span class="uc-tag"><b style="font-size:15px;line-height:1">\u25c6</b><span>'+esc(myProf.team_code)+'</span></span>';
    }catch(e){}
    tcHtml = '<div class="me-card'+(fv?' me-bare':'')+'">'+(window.hkPlayerCard?window.hkPlayerCard({
      name:(myProf&&myProf.handle)||'set a name', show:lo.show,
      tierEmblem:window.rankEmblem?window.rankEmblem(tier.name,60,tier.bucket):'',
      tierChipEmblem:window.rankEmblem?window.rankEmblem(tier.name,15,tier.bucket):'',
      tierLabel:tier.full||tier.name,
      lvl:L.lvl, pct:L.pct, xpLine:L.into+' / '+L.need+' xp',
      stats:[{n:mine.length,label:'clean solves'},{n:st.crowns,label:st.crowns===1?'crown':'crowns'},
        {n:st.pod,label:'podiums'},{n:st.att,label:'boards'},{n:(streakN?'\ud83d\udd25 '+streakN:'\u2014'),label:'streak'}],
      medals:medals, medalSlots:5, boards:[], tagsHtml:tagBits, flair:fv, owner:true
    },{scale:'full'}):'')+'</div>';
  }
  /* r293 (Wolf): TIME SAVED — the professional's core metric, same methodology as the
     desk report: your first recorded time vs your current best on each re-drilled task,
     summed. Server runs when signed in (created_at ordering), local history otherwise. */
  let savedMs=0;
  try{
    const firstBy={}, bestBy={};
    let src2=[];
    if(mine.length){ src2=mine.slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).map(r=>({d:r.challenge, t:r.time_ms})); }
    else{ src2=JSON.parse(localStorage.getItem('hk_runs_lite')||'[]').map(r=>({d:r.d, t:r.time_ms})).filter(r=>r.d); }
    src2.forEach(r=>{ if(firstBy[r.d]===undefined) firstBy[r.d]=r.t;
      if(bestBy[r.d]===undefined||r.t<bestBy[r.d]) bestBy[r.d]=r.t; });
    Object.keys(firstBy).forEach(d=>{ const s=firstBy[d]-bestBy[d]; if(s>0) savedMs+=s; });
  }catch(e){}
  const savedTxt = savedMs<=0 ? '\u2014'
    : savedMs<60000 ? (savedMs/1000).toFixed(0)+'<em>s</em>'
    : savedMs<3600000 ? Math.round(savedMs/60000)+'<em>m</em>'
    : Math.floor(savedMs/3600000)+'<em>h</em> '+Math.round((savedMs%3600000)/60000)+'<em>m</em>';
  const cardsHtml = `<div class="cards">
    <div class="stat lead"><div class="big">${savedTxt}</div><div class="lbl">time banked \u2014 first try vs best</div></div>
    <div class="stat"><div class="big">${drilled.size}<em> / ${D.menuOrder.length}</em></div><div class="lbl">drills on your board</div></div>
    <div class="stat"><div class="big">${avgEff!==null?avgEff+'<em>%</em>':'—'}</div><div class="lbl">avg keys vs optimal path</div></div>
    <div class="stat"><div class="big">${streakN?'🔥 '+streakN:'—'}</div><div class="lbl">day streak</div></div>
  </div>`;
  /* r384 (Wolf): signed-out leads with the sign-in placeholder, not a dashboard.
     Local practice tiles only render when this device actually holds some, under a
     THIS-DEVICE caption; a fresh anon visitor gets the placeholder alone. No rank
     renders anywhere on the anon path (the title card is signed-in only). */
  let html = '';
  if(!me){
    const hasLocal = drilled.size>0 || streakN>0 || savedMs>0;
    html += `<div class="state" style="margin:22px 0 16px">Sign in to see your stats — ranks, run history, efficiency, and the ladder all live on your account.<br><br>`+
      `<a class="acc-cta" href="index.html?openAuth=signin">Sign in</a>`+
      `<a class="acc-cta ghost" href="index.html?openAuth=signup">Create an account</a></div>`;
    if(hasLocal){
      html += `<div class="local-cap">this device only — local practice, not posted to an account</div>`+
        `<div class="hero solo" style="margin-top:8px">${cardsHtml}</div>`;
    }
  } else {
    html += `<div class="hero${tcHtml?'':' solo'}">` + tcHtml + cardsHtml + `</div>`;
  }

  /* ---- r426 (Wolf, ROUND2_FEEDBACK §4b): CERTIFICATION PATHS — "fill the gap under the
     streak card with a certification-paths checklist; completed paths get a visual reward
     (color/congrats), incomplete ones a 'go get going' cue."
     Moved UP from below Analytics (it used to close the page, where nobody read it) and
     rebuilt from a bare progress bar into a three-track checklist. Same data contract as
     before: r371 law — a track leg counts only on a POSTED run (mine[]), never a
     local-only clear, because that is what issue_certificate() verifies server-side.
     A complete track wears the congrats state; an incomplete one names the next drill to
     run and links straight into it. ---- */
  if(window.HK_TRACKS && window.HK_TRACKS.length){
    const trk = window.HK_TRACKS.map(t=>{
      const ks=t.keys||[];
      const done=ks.filter(k=> mine.some(r=>r.challenge===k));
      const left=ks.filter(k=> !mine.some(r=>r.challenge===k));
      return { t, ks, n:done.length, left, pct: ks.length?Math.round(100*done.length/ks.length):0,
               full: !!(ks.length && done.length>=ks.length) };
    });
    const fullN = trk.filter(x=>x.full).length;
    html += `<h3 class="section-title">Certification paths <span style="color:var(--faint)">${fullN} / ${trk.length} complete</span></h3>`;
    html += `<div class="certpaths">`;
    trk.forEach(x=>{
      const nextK = x.left[0];
      const nextL = nextK ? (D.labelOf[nextK]||nextK) : '';
      html += `<div class="cp${x.full?' cp-done':''}">`+
        `<div class="cp-h"><span class="cp-tick">${x.full?'✓':''}</span>`+
          `<span class="cp-nm">${esc(x.t.name)}</span>`+
          `<span class="cp-cert">→ “${esc(x.t.cert)}”</span>`+
          `<span class="cp-ct">${x.n} / ${x.ks.length}</span></div>`+
        `<div class="cp-bar"><i style="width:${x.pct}%"></i></div>`+
        (x.full
          ? `<div class="cp-msg cp-win">🎉 Path complete — claim the certificate in the trainer</div>`
          : `<div class="cp-msg">${x.ks.length-x.n} drill${x.ks.length-x.n===1?'':'s'} to go`+
            (nextK?` · next up <b>${esc(nextL)}</b>`:'')+
            (nextK?` <a class="cp-go" href="index.html?drill=${encodeURIComponent(nextK)}">run it →</a>`:'')+
            `</div>`)+
        `</div>`;
    });
    html += `</div>`;
    if(fullN>0 && fullN===trk.length){
      html += `<div class="cp-allwin">🏆 <b>All three paths certified.</b> Every drill in the catalog has a posted, keyboard-only clear against your name.</div>`;
    }
  }

  /* ---- r426 (Wolf, ROUND2_FEEDBACK §4b): "put the ANALYTICS ABOVE the achievement
     overview". The wall is built here (it needs `mine`/`all`/`localPB`, which are in
     scope from here on) but BANKED into achHtml and appended AFTER the pace chart,
     Lifetime and Analytics sections. Build order and print order are now separate
     things — don't re-inline this into `html`. ---- */
  let achHtml='';
  // ================= r135/r138: ACHIEVEMENTS — prominent, tipped, rarity-tiered =================
  // Earned medals are clickable — pick up to 3 to SHOWCASE on your player card.
  // r138: instant data-tip overlays (name · what it is · global rarity), computed
  // Steam-style from every player's runs. r384 (Wolf): ONE color axis — glyphs are
  // uniform engraved steel (themes.js hkBadge); the outer RING alone carries rarity,
  // colors from the shared window.HK_RARITY map (common green · rare blue · epic
  // purple · legendary orange · mythic red — the hand-set 'm' class keeps its
  // ornate ring + crest crown).
  try{
    const AC=window.HOTKEY_ACHIEVEMENTS;
    if(AC && window.hkBadge){
      let solvesN=0; try{ solvesN=parseInt(localStorage.getItem('hotkey_solves')||'0',10)||0; }catch(e){}
      let runsL=mine.length?mine:[]; if(!runsL.length){ try{ runsL=JSON.parse(localStorage.getItem('hk_runs_lite')||'[]'); }catch(e){} }
      let flags={}; try{ flags=JSON.parse(localStorage.getItem('hk_ach_flags')||'{}'); }catch(e){}
      const pbCtx={...localPB};
      mine.forEach(r=>{ const t=r.time_ms/1000; if(pbCtx[r.challenge]===undefined||t<pbCtx[r.challenge]) pbCtx[r.challenge]=t; });
      let crowns=0;
      if(me && all.length){ const seen={};
        all.forEach(r=>{ if(!D.meta[r.challenge]) return; if(seen[r.challenge]) return; seen[r.challenge]=r.user_id; });
        crowns=Object.values(seen).filter(u=>u===me.id).length; }
      const groups={}; Object.entries(D.groupOf).forEach(([k,g])=>{(groups[g]=groups[g]||[]).push(k);});
      let __ck=0, __kl=0; try{ const kc=(srvKeys&&srvKeys.counts) || JSON.parse(localStorage.getItem('hk_key_counts')||'{}');
        __ck=Object.keys(kc).filter(isChordUnit).length;   // r272: semantic units · r273: account-first
        __kl=Math.max((srvKeys&&srvKeys.keys_lifetime)||0,
          parseInt(localStorage.getItem('hk_keys_lifetime')||'0',10) || Object.values(kc).reduce((a,b)=>a+(b|0),0)); }catch(e){}
      const ctx={ pb:pbCtx, pars:window.HOTKEY_PARS||{}, runs:runsL, streak:streakN, solves:solvesN,
        mouseRuns:flags.mouseRuns||0, slowWins:flags.slowWins||0,
        nightWin:!!flags.nightWin, dawnWin:!!flags.dawnWin, weekendWin:!!flags.weekendWin,
        raceWins:flags.raceWins||0, sheetClears:flags.sheetClears||0, frzBanked:flags.frzBanked||0,
        chordKinds:__ck, keysLifetime:__kl, dailyTop10:flags.dailyTop10||0,   // r150/r151 · r371
        dailyPod:flags.dailyPod||0, dailyWins:flags.dailyWins||0, certs:Object.keys(flags.certTracks||{}).length,
        /* r376: mythic-class keys — beta-era account + the packed rank latch + the S+++ desk latch */
        charter:!!(me && me.created_at && String(me.created_at) < '2026-10-01'),
        foundingClass:!!(window.hkFoundingFlags&&window.hkFoundingFlags().class),
        foundingPartner:!!(window.hkFoundingFlags&&window.hkFoundingFlags().partner),
        tierBest:flags.tierBest|0, tierBestBucket:flags.tierBestBucket|0, deskPeak:flags.deskPeak||0,
        crowns, att:drilled.size, menuOrder:D.menuOrder, groups };
      // global rarity (Steam-style): evaluate run-derivable achievements for every player
      const globalPct=(function(){
        try{
          if(!all.length) return {};
          const byUser={}; all.forEach(r=>{ (byUser[r.user_id]=byUser[r.user_id]||[]).push(r); });
          const uids=Object.keys(byUser); if(uids.length<2) return {};
          const PARS2=window.HOTKEY_PARS||{}; const out={};
          const perBoard={}; { const seen={};
            all.forEach(r=>{ if(!D.meta[r.challenge]) return; const k2=r.challenge;
              if(!perBoard[k2]) perBoard[k2]=[]; const kk=k2+'|'+r.user_id;
              if(!seen[kk]){ seen[kk]=1; perBoard[k2].push(r.user_id); } }); }
          uids.forEach(u=>{
            const runs=byUser[u]; const best={}; const days=new Set();
            runs.forEach(r=>{ const ch=r.challenge;
              if(best[ch]===undefined||r.time_ms<best[ch]) best[ch]=r.time_ms;
              if(r.created_at) days.add(String(r.created_at).slice(0,10)); });
            const pbU={}; Object.keys(best).forEach(k2=>pbU[k2]=best[k2]/1000);
            const ds=[...days].sort(); let streakU=ds.length?1:0, cur=1;
            for(let i=1;i<ds.length;i++){ const gap=(new Date(ds[i])-new Date(ds[i-1]))/86400000;
              cur = gap===1 ? cur+1 : 1; if(cur>streakU) streakU=cur; }
            let crownsU=0; D.menuOrder.forEach(k2=>{ const b=perBoard[k2]||[]; if(b.length&&b[0]===u) crownsU++; });
            const attU=D.menuOrder.filter(k2=>pbU[k2]!==undefined).length;
            const ctxU={ pb:pbU, pars:PARS2, runs, streak:streakU, solves:runs.length, crowns:crownsU, att:attU, menuOrder:D.menuOrder, groups };
            AC.forEach(a=>{ let ru; try{ ru=a.test(ctxU); }catch(e){ ru={done:false}; }
              if(ru.done) out[a.id]=(out[a.id]||0)+1; });
          });
          Object.keys(out).forEach(k2=>out[k2]=Math.round(100*out[k2]/uids.length));
          AC.forEach(a=>{ if(out[a.id]===undefined) out[a.id]=0; });
          out.__n=uids.length;   // r150: field size gates whether the % means anything
          return out;
        }catch(e){ return {}; }
      })();
      let earnedN=0; const cells=[]; const rarPresent={};   /* r393 (Wolf #91): which rarity tiers actually appear, for the picker-style chip row */
      AC.forEach((a,ord)=>{ let r; try{ r=a.test(ctx); }catch(e){ r={done:false,prog:0,goal:1}; }
        if(r.done) earnedN++;
        /* r150: EFFECTIVE rarity \u2014 static difficulty tier is the display floor until
           the field is big enough (>=20 players) for the live % to mean anything */
        const __fN=globalPct.__n||0;
        const gp=window.hkEffRarity?window.hkEffRarity(a.tier, globalPct[a.id], __fN):globalPct[a.id];
        const tierW=(window.hkRarityTier?window.hkRarityTier(gp):null);
        rarPresent[tierW||'common']=1;
        const rm=(window.hkRarityMeta?window.hkRarityMeta(gp):{abbr:'',color:'var(--warn)',weight:3});
        const rareTxt=(__fN>=20 && globalPct[a.id]!==undefined)
          ? (' \u00b7 '+(tierW?tierW.toUpperCase()+' \u2014 ':'')+globalPct[a.id]+'% of players have this')
          : (tierW?' \u00b7 '+tierW.toUpperCase():'');
        const __state=r.done?'earned':((r.prog||0)>0?'prog':'locked');
        // r293 (Wolf): a rarity tag under earned rare+ medals + rarity-ordered wall
        const rlabel=(r.done && rm.abbr) ? '<span class="rr" style="color:'+rm.color+'">'+rm.abbr+'</span>' : '';
        /* r423 (Wolf): the .feat tray marker + \u2605 star are GONE \u2014 the wall no longer
           displays what's currently shown on cards (distracting); the card itself carries it. */
        const cellHtml='<span class="ach-pick'+(r.done?' earned':'')+'" data-ach="'+a.id+'" data-state="'+__state+'" data-rarity="'+(tierW||'common')+'"'+
          ' data-tip="'+esc(a.name)+' \u2014 '+esc(a.desc)+(r.done?' \u2713 EARNED':' \u00b7 '+(r.prog||0)+'/'+(r.goal||1))+rareTxt+'">'+
          /* r389 (Wolf): clean glyph, no engraved hexagon \u2014 matches the player card.
             Earned wears its rarity color; locked/in-progress dim. Falls back to the
             legacy badge only if a glyph id somehow isn't in the new set. */
          (function(){ const gl=window.hkGlyph?window.hkGlyph(a.glyph,40,(r.done?rm.color:'var(--faint)')):'';
            return gl ? '<span class="ach-ic'+(r.done?'':' dim')+'">'+gl+'</span>'
              : window.hkBadge(a.glyph, r.done, 40, null, r.done?gp:undefined); })()+
          (r.done?'':'<i>'+Math.min(99,Math.round(100*(r.prog||0)/(r.goal||1)))+'%</i>')+
          esc(a.name)+rlabel+'</span>';
        // earned float to the top, then rarest-first, then catalog order
        cells.push({ html:cellHtml, sort:(r.done?0:1000)+rm.weight*100+ord,
          cat:(window.hkAchCat?window.hkAchCat(a):{label:'Other',ord:99}), rw:rm.weight, ord, done:!!r.done });
      });
      cells.sort((x,y)=>x.sort-y.sort);
      const grid=cells.map(c=>c.html).join('');
      /* ---- r426 (Wolf, ROUND2_FEEDBACK §4b): "with all-types/all-rarities chips selected,
         organize by achievement TYPE then by RARITY — rows laid out so you can see
         progression along each category."
         Two renderings of the SAME cells, swapped in place (never both in the DOM):
           · CATEGORY view — used when both chips read "all", i.e. nothing is filtered.
             Sections come from drills.js HOTKEY_ACH_CATS (glyph -> category, so no
             achievement carries a second hand-kept field); inside a section, cells run
             COMMON -> MYTHIC (rm.weight descends 4..0), then catalog order, so each row
             reads as that category's ladder.
           · FLAT view — the r293 earned-first / rarest-first wall, used the moment any
             chip narrows the set (a filtered category view would strand empty headers).
         ---- */
      const __byCat={};
      cells.forEach(c=>{ const k=c.cat.label;
        (__byCat[k]=__byCat[k]||{ord:c.cat.ord, items:[]}).items.push(c); });
      const catGrid=Object.keys(__byCat)
        .sort((a2,b2)=>(__byCat[a2].ord-__byCat[b2].ord)||a2.localeCompare(b2))
        .map(k=>{ const g=__byCat[k];
          const items=g.items.slice().sort((x,y)=>(y.rw-x.rw)||(x.ord-y.ord));
          const gotN=items.filter(i=>i.done).length;
          return '<div class="ach-cat"><div class="ach-cat-h">'+esc(k)+
            '<span>'+gotN+' / '+items.length+'</span></div>'+
            '<div class="ach-grid ach-cat-g">'+items.map(i=>i.html).join('')+'</div></div>'; }).join('');
      window.__achFlat=grid; window.__achCats=catGrid;
      /* r393 (Wolf #91): a rarity-tier chip row beside the state chips, mirroring the profile
         medal picker. Each chip is tinted its rarity color (same HK_RARITY map the rings wear);
         only tiers that actually appear on the wall get a chip. State + rarity filters compose. */
      const __RCq=window.HK_RARITY||{};
      const __rarChips=['common','rare','epic','legendary','mythic'].filter(t=>rarPresent[t]).map(t=>{
        const col={common:__RCq.c,rare:__RCq.r,epic:__RCq.e,legendary:__RCq.l,mythic:__RCq.m}[t]||'var(--muted)';
        return '<button class="ach-rf" data-r="'+t+'" style="--rc:'+col+'">'+t+'</button>'; }).join('');
      /* r404 (Wolf): default to the EARNED view (any rarity) — a streamlined "what I've won"
         wall; chips still open all/in-progress/locked. New users with nothing earned fall
         back to "all" so the wall never looks empty on first visit. */
      const __defF = earnedN>0 ? 'earned' : 'all';
      achHtml += '<h3 class="section-title" id="achievements" style="margin-top:10px">Achievements <span style="color:var(--faint)">'+earnedN+' / '+AC.length+'</span>'+
        '<span class="ach-filters">'+
          '<button class="ach-f'+(__defF==='all'?' on':'')+'" data-f="all">all</button>'+
          '<button class="ach-f'+(__defF==='earned'?' on':'')+'" data-f="earned">earned</button>'+
          '<button class="ach-f" data-f="prog">in progress</button>'+
          '<button class="ach-f" data-f="locked">locked</button>'+
          '<span class="ach-fdiv"></span>'+
          '<button class="ach-rf on" data-r="all">any rarity</button>'+__rarChips+
        '</span></h3>'+
        '<div class="ach-hint">all + any rarity groups the wall BY TYPE, common \u2192 mythic within each \u00b7 any other chip flattens it, earned and rarest first \u00b7 pick which to <b style="color:var(--warn)">\u2605 showcase</b> on your player card from <a href="profile.html#showcase" style="color:var(--accent)">your profile \u2197</a>'+(me?'':' \u00b7 sign in to show them on the boards')+
        /* r376: legend rides the shared HK_RARITY map \u2014 same colors the badge rings wear */
        (function(){ const RC=window.HK_RARITY||{};
          return '<br>color = rarity: <b style="color:'+RC.c+'">COMMON</b> \u00b7 <b style="color:'+RC.r+'">RARE</b> (\u226425% of players) \u00b7 <b style="color:'+RC.e+'">EPIC</b> (\u226410%) \u00b7 <b style="color:'+RC.l+'">LEGENDARY</b> (\u22643%) \u00b7 <b style="color:'+RC.m+'">MYTHIC</b> (the rarest handful)</div>'; })()+
        /* r426 (§4b): #achHost swaps between the CATEGORY and FLAT renderings (achView()
           below). all/all -> categories; any narrowing chip -> the flat filtered wall. */
        '<div id="achHost">'+(__defF==='all'
          ? catGrid
          : '<div class="ach-grid" data-f="'+__defF+'">'+grid+'</div>')+'</div>';
    }
  }catch(e){}

  // WEAK-DRILL NUDGE + insights (signed-in, ranked data available)
  if(me && window.HK_RANK){
    const st2 = window.HK_RANK.standing(all, me.id, D.menuOrder);
    let worst=null, bestD=null;
    D.menuOrder.forEach(k=>{
      const board=st2.per[k]; const idx=board.findIndex(r=>r.user_id===me.id);
      if(idx<0) return;
      const pct=idx/board.length;
      if(!worst||pct>worst.pct) worst={k,pct,idx,n:board.length};
      if(!bestD||pct<bestD.pct) bestD={k,pct,idx,n:board.length};
    });
    if(worst && worst.pct>0){
      html += `<div class="stat" style="grid-column:1/-1;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-color:var(--warn);margin:2px 0 6px">`+
        `<span style="font-size:20px">\ud83c\udfaf</span>`+
        `<div style="flex:1;min-width:200px"><div style="font-family:var(--mono);font-size:13px">Your weakest board: <b>${esc(D.labelOf[worst.k]||worst.k)}</b> \u2014 #${worst.idx+1} of ${worst.n} (top ${Math.max(1,Math.round(worst.pct*100))}%)</div>`+
        `<div style="font-family:var(--mono);font-size:11px;color:var(--muted)">one clean run there moves your average more than anywhere else</div></div>`+
        `<a href="index.html?drill=${worst.k}" style="font-family:var(--mono);font-size:12px;color:var(--accent);border:1px solid var(--accent-dim);border-radius:999px;padding:8px 16px">run it \u2192</a></div>`;
    }
    /* r150 (Wolf: "what is pace based on?") — strongest board gets its numbers, and
       pace is now DEFINED on the page: time ÷ par, so runs on different drills
       compare honestly. Plus keys/min so raw hand speed has its own dial. */
    if(bestD){
      const board=st2.per[bestD.k]||[];
      const mineRow=board[bestD.idx], leadRow=board[0];
      const gapTxt=(bestD.idx>0 && leadRow && mineRow)?(' \u00b7 +'+((mineRow.time_ms-leadRow.time_ms)/1000).toFixed(2)+'s off #1'):(bestD.idx===0?' \u00b7 you lead it':'');

  // r150: PACE = time vs par (each point is one run's time \u00f7 that drill's par) \u2014

  /* r423 (Wolf: "more numbers on the pace chart"): every point carries its figures \u2014

  if(mine.length>=3){
    const PARS3=window.HOTKEY_PARS||{};

    const pbOf={}; mine.forEach(r=>{ if(pbOf[r.challenge]===undefined) pbOf[r.challenge]=r.time_ms; });
    const recent=mine.slice().sort((a,b)=>new Date(a.created_at||0)-new Date(b.created_at||0))

      const rs=recent.map(r=>{ const parMs=PARS3[r.challenge]*1000;
        return { v:r.time_ms/parMs, t:r.time_ms, dPar:r.time_ms-parMs, dPB:r.time_ms-pbOf[r.challenge],

          when:r.created_at?new Date(r.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'' }; });
      const vs=rs.map(p=>p.v);
      const mn=Math.min(...vs,0.9), mx=Math.max(...vs,1.1), span=Math.max(.01,mx-mn);
      /* r382 (Wolf): W~panel width + preserveAspectRatio="none" \u2014 the default xMid

      const W=1080,H=54;
      const y=v=>(6+(v-mn)/span*(H-12));
      const pts=rs.map((p,i)=>`${(i/(rs.length-1)*W).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
      const med=vs.slice().sort((a,b)=>a-b)[Math.floor(vs.length/2)];
      const kpm=mine.filter(r=>r.time_ms>0&&r.keystrokes>0).map(r=>r.keystrokes/(r.time_ms/60000)).sort((a,b)=>a-b);
      const kpmMed=kpm.length?Math.round(kpm[Math.floor(kpm.length/2)]):null;
      const sgn=ms=>(ms>0?'+':'\u2212')+(Math.abs(ms)/1000).toFixed(2)+'s';
      const pbTxt=p=>p.dPB<=0?'PB run':('+'+(p.dPB/1000).toFixed(2)+'s vs PB');
      // hoverable markers \u2014 native <title> tooltips, no scripting, reduced-motion safe
      const dots=rs.map((p,i)=>{ const cx=(i/(rs.length-1)*W).toFixed(1), cy=y(p.v).toFixed(1);

      const last=rs[rs.length-1];
      html += `<div class="stat" style="grid-column:1/-1;margin-bottom:6px"><div class="lbl" style="margin:0 0 8px">pace \u00b7 time vs par \u00b7 last ${rs.length} runs \u2014 below the dashed line = under par`+
        `<span style="float:right;color:var(--muted)">median ${med.toFixed(2)}\u00d7 par${kpmMed?' \u00b7 '+kpmMed+' keys/min':''}</span></div>`+
        `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px;display:block">`+
        `<line x1="0" y1="${y(1).toFixed(1)}" x2="${W}" y2="${y(1).toFixed(1)}" stroke="var(--line)" stroke-width="1" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>`+
        `<text x="4" y="${(y(1)-3).toFixed(1)}" fill="var(--faint)" font-size="8" font-family="var(--mono)">par 1.00\u00d7</text>`+
        `<text x="${W-4}" y="13" text-anchor="end" fill="var(--faint)" font-size="8" font-family="var(--mono)">${mn.toFixed(2)}\u00d7</text>`+
        `<text x="${W-4}" y="${H-5}" text-anchor="end" fill="var(--faint)" font-size="8" font-family="var(--mono)">${mx.toFixed(2)}\u00d7</text>`+

        dots+
        `</svg>`+
        `<div style="font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:7px">last run: <b style="color:var(--text)">${esc(last.lab)}</b> \u00b7 ${(last.t/1000).toFixed(2)}s \u00b7 ${last.v.toFixed(2)}\u00d7 par \u00b7 <b style="color:${last.dPar<=0?'var(--accent)':'var(--warn)'}">${sgn(last.dPar)} vs par</b> \u00b7 ${pbTxt(last)} \u2014 hover a point for its numbers</div>`+
        `<div style="font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:6px">how it's computed: each point = one posted run's time \u00f7 that drill's par, oldest \u2192 newest. keys/min = keystrokes \u00f7 minutes across posted runs (median).</div></div>`;

  // ---- Analytics (PRO \u00b7 free in beta): key frequency + speed by drill ----
  if(me && mine.length>=3){
    let traces=[];
    try{ const tr=await sb.from('runs').select('trace').eq('user_id',me.id).eq('mouse_used',false)
      .order('created_at',{ascending:false}).limit(40); traces=(tr.data||[]).map(x=>x.trace).filter(Boolean); }catch(e){}
    const chordFreq={};
    // r272: traces run through the same chordifier as the local tally — one vocabulary
    traces.forEach(t=>{ const seq=(Array.isArray(t)?t:[]).map(k=>(k&&k.k)||k).filter(k=>typeof k==='string');
      chordifyLog(seq).forEach(u=>{ chordFreq[u]=(chordFreq[u]||0)+1; }); });
    const top=Object.entries(chordFreq).sort((a,b)=>b[1]-a[1]).slice(0,12);
    // lifetime tiles from the full posted-run history
    {
      const totKeys=mine.reduce((a,r)=>a+(r.keystrokes||0),0);
      const totMs=mine.reduce((a,r)=>a+(r.time_ms||0),0);

      /* r423 (Wolf): the busiest-day tile shows the figures that matter \u2014 solves that

      const perDay={}; mine.forEach(r=>{ const d=String(r.created_at||'').slice(0,10); if(!d) return;
        const o=perDay[d]=perDay[d]||{n:0,saved:0,keys:0};

      const bWhen=busiest?new Date(busiest[0]+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}):null;
      const bSavedTxt=busiest&&busiest[1].saved>0

        `<div class="stat"><div class="num">${fmtT(totMs)}</div><div class="lbl">time on the grid</div></div>`+
        `<div class="stat"><div class="num">${distinctChords}</div><div class="lbl">distinct shortcuts used \u00b7 last ${traces.length} runs</div></div>`+
        `<div class="stat"><div class="num">${busiest?busiest[1].n:0}<em> solves</em></div><div class="lbl">busiest day \u00b7 ${busiest?bWhen:'\u2014'}${bSavedTxt?' \u00b7 '+bSavedTxt:''}</div></div>`+
        `</div>`;
    }
    const maxF=top.length?top[0][1]:1;
    // fastest drills by keys/sec (best run per drill)
    const kps={};
    mine.forEach(r=>{ if(r.time_ms>0&&r.keystrokes>0){ const v=r.keystrokes/(r.time_ms/1000);
      if(!kps[r.challenge]||v>kps[r.challenge]) kps[r.challenge]=v; } });
    const kpsTop=Object.entries(kps).filter(([k])=>D.meta[k]).sort((a,b)=>b[1]-a[1]).slice(0,5);
    html += `<h3 class="section-title">Analytics <span class="proTag" style="float:right;font-size:9px;color:var(--warn);letter-spacing:1px;cursor:pointer" title="what comes with PRO">PRO \u00b7 free in beta</span></h3>`;
    // r91 MERGED PANEL: local tally (every clean run) is the primary source; posted-run

      tEnts.forEach(([k,n])=>{ html += `<div style="display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11.5px;margin-bottom:5px">`+
        `<span style="min-width:86px;color:var(--text)">${esc(k)}</span>`+
        `<span style="flex:1;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden"><span style="display:block;height:100%;width:${Math.round(100*n/mxT)}%;background:var(--accent);border-radius:99px"></span></span>`+
        `<span style="color:var(--muted);min-width:36px;text-align:right">${n}</span></div>`; });
      html += `</div>`;
    }
    if(kpsTop.length){

      kpsTop.forEach(([k,v])=>{ html += `<div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;padding:4px 0"><span>${esc(D.labelOf[k]||k)}</span><b style="color:var(--accent)">${v.toFixed(1)} k/s</b></div>`; });
      html += `</div>`;
    }
  }
  /* r426 (Wolf §4b): the achievement wall PRINTS here — under pace + Lifetime +
     Analytics, above the per-drill wall. Built ~250 lines up into achHtml. */
  html += achHtml;
  /* r393 (Wolf): the Per-drill wall used to print EVERY drill in the catalog as a flat
     ~80-row strip — the single biggest source of dead length on the page. It's now behind
     a chapter picker: one group at a time, defaulting to where you've been most active.
     "prioritize stats … use a drop down to show the drill individual feedback." */
  /* r423 (Wolf): individual drills COLLAPSE to compact one-line rows (items 5/6 of the
     bug batch) \u2014 the eff bar is retired, padding tightens, and a tried row clicks open
     to its RUN HISTORY: the last 5 runs with time \u00b7 \u0394 vs PB \u00b7 \u0394 vs par \u00b7 keys \u00b7 date,
     plus "show more" for the rest (display-level only; retention is a queued decision). */
  const histSrc = mine.length ? mine : (function(){ try{
    return JSON.parse(localStorage.getItem('hk_runs_lite')||'[]')
      .map(r=>({challenge:r.d, time_ms:r.time_ms, keystrokes:r.keystrokes,
        created_at:r.created_at || (r.ts?new Date(r.ts).toISOString():null)}))
      .filter(r=>r.challenge); }catch(e){ return []; } })();
  window.__pdHist=(k, lim)=>{

    if(!runs.length) return '<div class="dh-row" style="color:var(--faint)">no run history here yet</div>';

  const pdRow = (k)=>{

      `<span class="pb">${fmtS(pbMs)}</span>`+

      `<span class="eff">${rankTxt}</span>`+
      `</div>`;
  };
  // group order + per-group done/total, and the default view (most of my activity)
  const pdGroups=[], gseen={};
  D.menuOrder.forEach(k=>{ const g=D.groupOf[k]||''; if(!gseen[g]){gseen[g]=1; pdGroups.push(g);} });
  const pdTouched = k => mine.some(x=>x.challenge===k) || localPB[k]!==undefined;

  let pdDef=pdGroups[0], pdBest=-1;
  pdGroups.forEach(g=>{ const c=pdCount(g).done; if(c>pdBest){pdBest=c; pdDef=g;} });
  window.__pdRow=pdRow; window.__pdGroupHtml=(g)=>D.menuOrder.filter(k=>(D.groupOf[k]||'')===g).map(pdRow).join('');
  const pdOpts=pdGroups.map(g=>{ const c=pdCount(g); return `<option value="${esc(g)}"${g===pdDef?' selected':''}>${esc(g)} · ${c.done}/${c.tot}</option>`; }).join('');
  html += `<h3 class="section-title pd-title">Per-drill<select id="pdPick" class="pd-pick" aria-label="pick a chapter">${pdOpts}</select></h3>`;
  html += `<div id="pdRows">${window.__pdGroupHtml(pdDef)}</div>`;

  if(mine.length){
    /* r423 (Wolf): the run ledger leads with the LAST 5 \u2014 the rest (up to 25) sits
       behind "show more". Display-level only; nothing about retention changes here. */
    const recent = mine.slice().sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0)).slice(0,25);
    const rrRow=r=>{
      const label = (D.labelOf[r.challenge]) || (r.challenge.indexOf('challenge-')===0?'\u25c6 daily challenge':(r.challenge.indexOf('daily-')===0?'\u26a1 daily':(r.challenge.indexOf('wk-')===0?'\ud83c\udfc1 gauntlet leg':r.challenge)));

      return `<div class="drow c"><span class="nm">${esc(label)}</span><span class="pb">${fmtS(r.time_ms)}</span><span class="eff">${r.keystrokes||'\u2014'} keys</span><span class="eff">${when}</span></div>`;

  // r393 (Wolf): per-drill chapter picker — swap the row block on change, no reload

        ev.preventDefault(); ev.target.click(); } };

  { const rb=document.getElementById('rrBtn'), rm=document.getElementById('rrMore');

  // r156: the analytics PRO tag opens the shared offer sheet

  /* r267 state chips + r393 rarity chips, r426 rewritten: both now go through achView(),

     = the flat earned/rarest-first wall, because a filtered category view strands headers. */
  function achView(){

    document.querySelectorAll('.ach-rf').forEach(x=>x.classList.toggle('on', x===b)); achView(); });
  // r387 (Wolf): the achievements WALL stays here as analytics (full grid, rarity,
  // progress) but SHOWCASE PICKING moved to the Profile page — this wall is display-only.
