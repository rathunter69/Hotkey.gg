name: Security platform bootstrap only
on:
  push:
    branches: [codex/security-platform-bootstrap]
    paths:
      - .github/workflows/security-platform-bootstrap.yml
      - supabase/tests/platform-bootstrap.js
      - supabase/tests/platform-bootstrap-check.sql
      - supabase/tests/platform-bootstrap.test.js
permissions:
  contents: read
concurrency:
  group: security-platform-bootstrap-${{ github.ref }}
  cancel-in-progress: false
jobs:
  platform:
    if: github.repository == 'rathunter69/Hotkey.gg' && github.event_name == 'push' && github.ref == 'refs/heads/codex/security-platform-bootstrap'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - name: Bootstrap guard unit tests
        run: node --test supabase/tests/platform-bootstrap.test.js
      - name: One platform-only experiment
        run: node supabase/tests/platform-bootstrap.js --run
      - name: Remove only named purpose-labelled experiment containers
        if: always()
        run: node supabase/tests/platform-bootstrap.js --cleanup
      - name: Save synthetic platform evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-platform-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hotkey-platform-bootstrap/
          if-no-files-found: warn
          retention-days: 7
