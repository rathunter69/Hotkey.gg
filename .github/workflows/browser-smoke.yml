# Browser smoke for the rebuild branch — non-blocking (REBUILD_PLAN §3). Under 2 minutes, every
# request that is not loopback is blocked inside the browser, no production services.
name: browser-smoke
on:
  push:
    branches: [main, rebuild]
  pull_request:
    branches: [main, rebuild]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install Playwright (pinned, not a site dependency)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Smoke
        run: node app2/tests/smoke.mjs
