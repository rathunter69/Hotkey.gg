# The rebuild branch gate: `npm run check` only (syntax + node unit tests, < 30 s).
# Read-only token, SHA-pinned actions, no browser, no network beyond checkout.
name: rebuild-check
on:
  push:
    branches: [main, rebuild]
  pull_request:
    branches: [main, rebuild]
permissions:
  contents: read
concurrency:
  group: rebuild-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm run check
