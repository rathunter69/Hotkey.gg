# Manual database deploy for the rebuild (replaces the old supabase-deploy.yml, which fired on
# any push to main touching supabase/**). Runs ONLY from the Actions tab, against the project
# named by the SUPABASE_PROJECT_REF repository variable, and only after approval on the
# `production` environment (repo Settings → Environments → production, Wolf as required
# reviewer — WOLF sets this up once). Migrations live under app2/supabase/migrations/.
name: db-deploy
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: db-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0
      - name: Check configuration
        run: |
          missing=0
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && { echo "::error::Repo secret SUPABASE_ACCESS_TOKEN is not set (app.supabase.com → account → Access Tokens)."; missing=1; }
          [ -z "$SUPABASE_DB_PASSWORD" ] && { echo "::error::Repo secret SUPABASE_DB_PASSWORD is not set (project → Settings → Database)."; missing=1; }
          [ -z "$PROJECT_REF" ] && { echo "::error::Repo variable SUPABASE_PROJECT_REF is not set (Settings → Secrets and variables → Actions → Variables)."; missing=1; }
          exit $missing
      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF" --workdir app2
      - name: Dry run (printed for the log)
        run: supabase db push --dry-run --workdir app2
      - name: Push migrations
        run: supabase db push --workdir app2
