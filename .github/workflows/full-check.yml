# The full node check: the gate plus the *.slow.test.js files (the liveness equivalence replay,
# which runs the old clone-based rule beside the in-place one over every lesson and drill).
# Non-blocking, nightly and on demand (CLAUDE.md: blocking checks stay fast). No browser, no network.
name: full-check
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: full-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'schedule' && 'rebuild' || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm run check:full
