<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hotkey.gg — lessons</title>
<!-- the saved palette lands before the first paint: a classic script restores the vars themes.js persisted -->
<script>try{var v=JSON.parse(localStorage.getItem('hotkey_theme_vars'));if(v&&v.vars){var r=document.documentElement;for(var k in v.vars)r.style.setProperty('--'+k,v.vars[k]);r.setAttribute('data-dark',v.dark?'1':'0');}}catch(e){}</script>
<script type="module">import { loadTheme } from './ui/themes.js'; loadTheme();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./ui/app.css">
<link rel="stylesheet" href="./ui/shell.css">
</head>
<body>
<div id="navMount"></div>
<div class="app"><div id="root"></div></div>
<script type="module">
  import { startApp } from './app/main.js';
  startApp({ navEl: document.getElementById('navMount'), rootEl: document.getElementById('root') });
</script>
</body>
</html>
