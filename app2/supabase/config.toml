# Supabase CLI config for the rebuild. Lets every CLI call take --workdir app2:
#   supabase link --project-ref <ref> --workdir app2
#   supabase db push --workdir app2          (review session / db-deploy workflow only)
#   supabase test db --workdir app2          (pgTAP, against the CLI's local stack)
project_id = "hotkey-app2"

[db]
# New projects default to Postgres 17; if `supabase link` reports a different major on the
# real project, fix this number in the same commit.
major_version = 17

# Phase E payment functions (docs/phases/E-checkout.md, section 5). Deployed by the payments build
# session after Wolf's go-ahead, never by CI. The webhook is called by Stripe, so it takes no JWT;
# it verifies Stripe's signature instead. The other two need the signed-in user's token.
[functions.create-checkout]
verify_jwt = true

[functions.billing-portal]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

# Ops functions (REBUILD_PLAN section 6; 0015_ops.sql). Kept in the repo, deployed only with Wolf's
# go-ahead. health is public by design (the uptime workflow pings it). weekly-digest checks its own
# caller (the service-role key, or a member of ops_admins), so the gateway's JWT check is off; it
# sends no email.
[functions.health]
verify_jwt = false

[functions.weekly-digest]
verify_jwt = false
